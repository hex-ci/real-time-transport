services:
  postgres:
    image: postgres:18
    container_name: real-time-transport-postgres
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit_password
      POSTGRES_DB: transit
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # postgres:18+ 用版本子目录（如 18/main）存数据，官方推荐挂父目录。
      # 不要挂到 /var/lib/postgresql/data —— 那是旧版路径，18 会认成
      # "未升级的残留数据" 而拒绝启动。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transit']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
