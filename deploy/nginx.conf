# 实时交通 前端 nginx 配置
# 前端全相对路径（fetch('/api/...') 与 `${location.host}/ws`），由 nginx 同源反代到
# 后端容器，规避 CORS，前端无需任何构建期后端地址配置。
#
# 反代目标 server:3000 是容器内端口，固定不变（容器有独立网络命名空间，不占用宿主
# 端口）。宿主机暴露的端口由 compose 的 WEB_PORT 决定。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 静态资源 gzip。Vite 产物已压缩过一次，此处只压文本类
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # REST API 反代（保留 /api 前缀，后端路由即以此为根）
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 健康检查（后端 /health 不在 /api 前缀下，供容器 healthcheck 与外部探活）
  location = /health {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket 反代（含协议升级头）。报站屏依赖此长连接推送实时车辆位置
  location /ws {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WS 长连接：放宽读写超时，避免报站屏空闲后被掐断
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA history 路由兜底
  location / {
    try_files $uri $uri/ /index.html;
  }
}
